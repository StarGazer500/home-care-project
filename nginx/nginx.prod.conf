user  nginx;
worker_processes  auto;
pid          /var/run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;
events {
  worker_connections 1024;
}


http{




include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
     log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout   300s ;
    client_body_timeout 300s;
    client_header_timeout 300s;
    send_timeout 300s;    
    proxy_cache_path   /tmp/ levels=1:2 keys_zone=s3_cache:10m max_size=500m
                    inactive=60m use_temp_path=off;

 server {
    listen 80;
    server_name 37.60.240.194;
    root /usr/share/nginx/html;

    # API routes - proxy to backend
    location /api {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_redirect off;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
      add_header 'Access-Control-Allow-Origin' 'http://37.60.240.194' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization' always;
      if ($request_method = OPTIONS) {
          return 204;
      }
      proxy_pass http://backend:8000;
    }

    # Assets directory - serve from object storage with caching
    location /assets/ {
      proxy_pass https://eu2.contabostorage.com/a253a9e59f414e2597c72a983cf85c9b:staticfiles/assets/;
      proxy_set_header Host eu2.contabostorage.com;
      proxy_ssl_server_name on;
      proxy_cache s3_cache;
      proxy_cache_valid 200 60m;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      add_header X-Cache-Status $upstream_cache_status;
      add_header Cache-Control "public, max-age=31536000";
    }

    # Everything else - serve index.html for React Router (standard SPA approach)
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
 }


}